name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
      - run: flutter create --platforms android .
      - name: Fix compileSdk and AGP
        run: |
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 35/' android/app/build.gradle.kts
          sed -i 's/compileSdkVersion 34/compileSdkVersion 35/' android/app/build.gradle 2>/dev/null || true
          sed -i "s/com.android.tools.build:gradle:7.3.0/com.android.tools.build:gradle:8.6.0/" android/build.gradle.kts
          sed -i "s/com.android.tools.build:gradle:7.3.0/com.android.tools.build:gradle:8.6.0/" android/build.gradle 2>/dev/null || true
      - run: cp google-services.json android/app/ || true
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
