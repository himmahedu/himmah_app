name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
      - name: Remove old android folder
        run: rm -rf android
      - name: Create Android project properly
        run: flutter create -t app --platforms android .
      - name: Fix AndroidManifest minSdkVersion
        run: find . -name "AndroidManifest.xml" -exec sed -i 's/minSdkVersion 21/minSdkVersion 23/g' {} \;
      - name: Fix compileSdkVersion
        run: |
          find . -name "build.gradle" -exec sed -i 's/compileSdkVersion 34/compileSdkVersion 35/g' {} \;
          find . -name "build.gradle.kts" -exec sed -i 's/compileSdk = 34/compileSdk = 35/g' {} \;
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk